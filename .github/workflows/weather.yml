name: weather
on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update weather & fx
        run: python scripts/update_weather.py
      - name: Commit & push if changed
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no change" || (git commit -m "auto: weather/fx" && git push)
